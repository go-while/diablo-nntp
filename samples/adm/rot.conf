# rot.conf - how adm/rot (and so adm/daily.atrim) keeps the old logs.
#
#	keep <n>	old copies of each log to keep (daily.atrim runs once a day,
#			so this is days of logs); without this line, 4
#	compress <m>	how the old copies are compressed: none, gzip, bzip2, xz,
#			zstd, compress, or a method of your own (below).  file.0,
#			yesterday's log, stays plain; file.1 and older are compressed.
#	method <name> <suffix> <command>
#			define a method: <command> reads the log on its standard
#			input and writes the compressed log to its standard output
#			(no quoting); <suffix> starts with a dot.  Example:
#	method lz4 .lz4 lz4 -q -c
#
# Changing the method is safe: copies made by the old one are rotated as they
# are, with their own suffix, until they are dropped; keep the "method" line of
# a method of your own until its copies are gone.  If the program of the
# method cannot be run, the copy stays uncompressed and rot exits 1.

keep 14
compress gzip
