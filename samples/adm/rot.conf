# rot.conf - how adm/rot (and so adm/daily.atrim) keeps the old logs.
#
# As installed, every line here is a comment and this file changes nothing:
# rot keeps file.0 to file.4, plain, as without a rot.conf.  Remove the "#" in
# front of the example lines at the end to use them.
#
#	keep <n>	keep file.0 to file.<n> of each log: n+1 old copies
#			(daily.atrim runs once a day, so n+1 days of logs).
#			0 to 9999; 0 keeps only file.0.  Without this line, 4.
#	compress <m>	how the old copies are compressed: none, gzip, bzip2, xz,
#			zstd, compress, or a method of your own (below).  file.0,
#			yesterday's log, stays plain; file.1 and older are compressed.
#	method <name> <suffix> <command>
#			define a method: <command> reads the log on its standard
#			input and writes the compressed log to its standard output
#			(no quoting); <suffix> starts with a dot.  Example:
#	method lz4 .lz4 lz4 -q -c
#
# cron runs rot with a short PATH, which may lack /usr/local/bin or
# /opt/local/bin: for a program there, give its full path in a method line
# (method lz4 .lz4 /usr/local/bin/lz4 -q -c; for a zstd there, for instance,
# method zst .zst /usr/local/bin/zstd -q -c).
#
# Changing the method is safe: copies made by the old one are rotated as they
# are, with their own suffix, until they are dropped; keep the "method" line of
# a method of your own until its copies are gone.  Lowering keep removes the
# copies above the new count at the next rotation.  If the program of the
# method fails, the copy stays uncompressed and rot exits 1.  A line rot does
# not understand, or a rot.conf it cannot read, stops it (exit 2) before any
# log is touched.

#keep 14
#compress gzip
