# DIABLO-CTL.CONF - settings for diablo-ctl (samples/adm/diablo-ctl).
#
# Copy to <path_home>/diablo-ctl.conf (or pass it with -f).  It is read by
# /bin/sh, so the syntax is NAME="value"; keep it owned by root and not
# writable by others.  Every setting is optional.

# The daemons "diablo-ctl start" (and stop, restart, status) manages without
# a daemon name: "diablo", "dreaderd" or "diablo dreaderd".
DIABLO_DAEMONS="diablo"

# Options for diablo, before "server".  -p (pathhost) is required.  Example:
# a feeder on port 435 next to a local dreaderd on 119 (see README.READER).
DIABLO_OPTS="-p feeder.example.com -h feeder.example.com -P 435"

# Options for dreaderd.  Example: a reader on 119 and 434.
DREADERD_OPTS="-p reader.example.com -h reader.example.com -P 119 -P 434"

# The directory with diablo, dreaderd, dicmd, drcmd and dpath.  Default: the
# dbin directory next to diablo-ctl's directory, else /news/dbin.
#DIABLO_BIN="/news/dbin"

# The user the daemons run as.  Default: news when run as root, else the user
# running diablo-ctl.  It only narrows the search for this site's dnewslink
# workers; the daemons themselves are found by their pid files in path_log.
#DIABLO_USER="news"

# Open-file limit to set before starting (ulimit -n).  Diablo needs at least
# 128 descriptors for a moderate installation.
#DIABLO_NOFILE="4096"

# Width of the status area diablo and dreaderd show in ps: the script passes
# "-s" plus this many spaces as the last argument (one word; it can't go into
# DIABLO_OPTS, whose spaces are split).  Empty or 0: none.
#DIABLO_PS_PAD="60"

# Seconds to wait for a clean exit (dicmd/drcmd exit) before SIGTERM, and for
# a started daemon to answer on its control socket.
#DIABLO_STOP_WAIT="30"
#DIABLO_START_WAIT="30"

# Checks before a start.  They are ON by default.  "diablo-ctl start" (and
# restart, and so the init scripts) runs them first and does not start a
# daemon when one fails: it prints every reason, exits with status 1, and the
# init system shows the service as failed with those lines in its log.
# "diablo-ctl check" runs them without starting anything.  What is checked:
#
#   - the mount points of DIABLO_MOUNTS are mounted (below);
#   - the active file (dactive.kp) the daemon uses exists: dreaderd always,
#     diablo only when diablo.config has "active" on.  A NEW site has none
#     yet, so create it first (README.READER: dsyncgroups) or start once with
#     "diablo-ctl -F start";
#   - the active file is not older than DIABLO_ACTIVE_MAXAGE hours, when set;
#   - no unclean shutdown after a long downtime, when DIABLO_MAX_DOWNTIME is set;
#   - the history file exists, when DIABLO_REQUIRE_HISTORY is "yes".
#
# "diablo-ctl -F start" skips the checks for that start (after you have looked
# at the site).  DIABLO_PREFLIGHT="no" turns all of them off for good, which
# is how the scripts behaved before the checks existed.
#DIABLO_PREFLIGHT="yes"

# Mount points that must be mounted (for the spool, the history on a RAM
# disk): a space separated list.  Default: none.
#DIABLO_MOUNTS="/news/spool /news/spool/group"

# "yes": diablo does not start without its history file.  Default "no":
# diablo makes an empty history (right for a new site), and diablo-ctl only
# notes that the file is missing when a snapshot (dhistory.snp or .old) exists.
# Set it to "yes" once the site has been running, so that an unmounted file
# system cannot make diablo start over with an empty history.
#DIABLO_REQUIRE_HISTORY="no"

# The active file (dactive.kp) must exist when the daemon uses it; with a
# number of hours it must also have been changed within that time (a
# machine that syncs it from an active file server, see adm/actsync).
#DIABLO_ACTIVE_MAXAGE="24"

# Unclean shutdown guard, in minutes: when the pid file of a daemon is left
# (the last run did not end with "diablo-ctl stop") and the daemon's activity
# log (article.log for diablo, drincoming.log for dreaderd) has not changed
# for that long, the daemon is not started until a person has looked at the
# site.  Systems whose find has no -mmin round this up to whole days.
#DIABLO_MAX_DOWNTIME="1440"

# "yes": trim and sort the active file (dkp -t and dkp -s) before a start, when
# no daemon of this site is running.
#DIABLO_DKP_TRIM="no"
