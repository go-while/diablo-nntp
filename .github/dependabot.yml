# Dependabot version updates: weekly pull requests for the GitHub Actions used in
# .github/workflows and for the Go module of the e2e tests (tests/e2e). The C code
# depends only on system libraries (OpenSSL, zlib, Berkeley DB), which Dependabot
# doesn't track.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: "/tests/e2e"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "tests/e2e"
    groups:
      go:
        patterns: ["*"]
