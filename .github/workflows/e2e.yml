name: e2e

# Build Diablo and run the end-to-end tests in tests/e2e (see tests/e2e/README.md).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/e2e/go.mod
          cache-dependency-path: tests/e2e/go.sum

      # Installs the build packages, creates the news user diablo switches to, and builds
      # with RADIUS off (Linux has no BSD libradius).
      - name: Build
        run: sudo tests/e2e/ci/build-on-host

      - name: Build log
        if: always()
        run: cat build.log

      # As the runner user, not root: diablo's switch to news then fails and it keeps
      # running as the runner, which owns the test sites in the temp directory.
      - name: Test
        working-directory: tests/e2e
        env:
          DIABLO_BIN: ${{ github.workspace }}/dbin
          NNTP_TEST_DEADLINE: 30s
        run: go test -v -count=1 ./...
